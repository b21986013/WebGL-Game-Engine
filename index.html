<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniGameEngine</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            display: flex;
            justify-content: center;  
            align-items: center;      
            background: #111;
        }

        #view-indicator 
        {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            padding: 6px 14px;
            font-family: monospace;
            font-size: 14px;
            background: rgba(0,0,0,0.6);
            color: #00ffcc;
            border-radius: 6px;
            pointer-events: none;
            z-index: 10;
        }
 
    </style>
    
    <script type="module" src="main.js"></script>
</head>

<body>
    
    <canvas id="gl-canvas" width="1000" height="600"></canvas>
    <div id="view-indicator">ENGINE VIEW</div>
   
</body>
</html>
